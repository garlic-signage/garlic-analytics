; PHP settings of the production image. The code of the image does not change, so it is never checked again.
expose_php = Off
display_errors = Off
log_errors = On
memory_limit = 256M
date.timezone = UTC

opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 64
opcache.max_accelerated_files = 4000
