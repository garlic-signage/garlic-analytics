# Apache in front of PHP-FPM, like the apache-fpm web server of the DDEV setup. It has no code of its own:
# every request goes to public/index.php of the php container, the application does the routing.

ServerRoot "/usr/local/apache2"
Listen 80

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule reqtimeout_module modules/mod_reqtimeout.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_fcgi_module modules/mod_proxy_fcgi.so

User daemon
Group daemon
ServerName localhost
ServerTokens Prod
ServerSignature Off

ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
CustomLog /proc/self/fd/1 combined

# Slow clients (slowloris) get cut off
RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500

# No files are served by this container, the document root is empty
DocumentRoot "/usr/local/apache2/htdocs"
<Directory />
    Require all denied
</Directory>

# php-fpm of the php container (service name "php"), every path is handled by index.php
ProxyFCGIBackendType GENERIC
ProxyFCGISetEnvIf "true" SCRIPT_FILENAME "/var/www/html/public/index.php"
ProxyFCGISetEnvIf "true" SCRIPT_NAME "/index.php"

<Location "/">
    Require all granted
    SetHandler "proxy:fcgi://php:9000"
    # The API key arrives as "Authorization: Bearer ...", FPM does not get this header unless it is passed on
    CGIPassAuth On
</Location>
