services:
  clickhouse:
    container_name: ddev-${DDEV_SITENAME}-clickhouse
    image: clickhouse/clickhouse-server:25.8
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: analytics
      CLICKHOUSE_PASSWORD: analytics
      VIRTUAL_HOST: ${DDEV_HOSTNAME}
      HTTP_EXPOSE: "8124:8123"
      HTTPS_EXPOSE: "8123:8123"
    volumes:
      - "${DDEV_APPROOT}/var/clickhouse:/var/lib/clickhouse"
      - ../schema:/docker-entrypoint-initdb.d
      - ".:/mnt/ddev_config"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    expose:
      - "8123"

volumes:
  clickhouse: