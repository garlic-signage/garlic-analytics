; Settings of the SystemLog module
; Maximum number of reports per request (architecture guideline: 5000)
max_events = 5000
; Reports with a reported_at older than this are rejected (system_log TTL is 6 months)
max_age_days = 180
; Tolerance for clocks of players running ahead
max_future_seconds = 86400
; Default and maximum number of records of a page of GET /v1/systemlog
default_limit = 100
max_limit = 1000
