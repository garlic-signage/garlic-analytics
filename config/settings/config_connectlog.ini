; Settings of the ConnectLog module
; Maximum number of connects per request (architecture guideline: 5000)
max_events = 5000
; Connects with a connected_at older than this are rejected (connect_log TTL is 4 years,
; to be set to 3 months with the TTL when the migration of SmilControl is done)
max_age_days = 1461
; Tolerance for clocks of players running ahead
max_future_seconds = 86400
